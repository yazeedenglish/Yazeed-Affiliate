<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل الدخول | Yazeed English</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F5F6F2;
      --ink: #00273a;
      --ink-soft: #5B645F;
      --primary: #00689b;
      --card: #FFFFFF;
      --line: #DCDFD6;
      --danger: #C94C4C;
    }

    [data-theme="dark"] {
      --paper: #15181C;
      --ink: #E8EAE4;
      --ink-soft: #A5ADA8;
      --primary: #0088C7;
      --card: #1E2227;
      --line: #343A40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Tajawal", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 39, 58, 0.06);
    }

    .top-actions {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 28px;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 19px;
      cursor: pointer;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      text-align: center;
    }

    .brand img {
      width: 66px;
      height: 66px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 104, 155, 0.12);
    }

    .submit-btn {
      width: 100%;
      min-height: 49px;
      margin-top: 4px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #FFFFFF;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .error {
      display: none;
      margin: 14px 0 0;
      color: var(--danger);
      font-size: 14px;
      text-align: center;
    }

    footer {
      margin-top: 26px;
      color: var(--ink-soft);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="top-actions">
      <button class="theme-btn" id="themeToggle" type="button"
        aria-label="تغيير المظهر">◐</button>
    </div>

    <div class="brand">
      <img src="https://file.yazeedenglish.com/logo.png"
        alt="Yazeed English">
      <div>
        <h1>لوحة الإدارة</h1>
        <p>سجّل الدخول للمتابعة</p>
      </div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          type="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="current-password"
          required
          autofocus
        >
      </div>

      <button class="submit-btn" type="submit">تسجيل الدخول</button>
      <p class="error" id="errorMessage" role="alert">
        كلمة المرور غير صحيحة.
      </p>
    </form>

    <footer>Yazeed English © <span id="currentYear"></span></footer>
  </main>

  </body>
</html>

  <script>

    /*
      BASIC DEMO ONLY — NOT SECURE.
      Change this password before testing.
      Anyone can inspect this file and discover it.
    */

    const expiry = Number(
  localStorage.getItem("ye_admin_login_expiry")
);

if (expiry && Date.now() < expiry) {
  window.location.replace("./statistics/");
}
   
    const ADMIN_PASSWORD = "admin`";

    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");
    const themeToggle = document.getElementById("themeToggle");

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = theme === "dark" ? "☀" : "◐";

      try {
        localStorage.setItem("ye_admin_theme", theme);
      } catch (_) {}
    }

    try {
      applyTheme(
        localStorage.getItem("ye_admin_theme") === "dark"
          ? "dark"
          : "light"
      );
    } catch (_) {
      applyTheme("light");
    }

    themeToggle.addEventListener("click", () => {
      const next =
        document.documentElement.dataset.theme === "dark"
          ? "light"
          : "dark";

      applyTheme(next);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (password.value !== ADMIN_PASSWORD) {
        errorMessage.style.display = "block";
        password.setAttribute("aria-invalid", "true");
        password.focus();
        return;
      }

      /*
        This session flag is only a convenience.
        It does not secure the statistics page.
      */
      const expiresAt = Date.now() + 90 * 24 * 60 * 60 * 1000;

localStorage.setItem("ye_admin_login_expiry", String(expiresAt));

window.location.href = "./statistics/";
    });

    password.addEventListener("input", () => {
      errorMessage.style.display = "none";
      password.removeAttribute("aria-invalid");
    });

     </script>
